/* ─────────────────────────────────────────────────────────────────
   JINKA SYNC  v4
   Modules:
     ClockSync       — NTP-style RTT / offset measurement
     DriftCorrector  — soft rate-based + hard-seek drift correction
     ReactionsSystem — floating emoji reactions
     JinkaSync       — WebSocket manager (replaces v3)
   ───────────────────────────────────────────────────────────────── */

const JINKA_WS_SERVER = 'wss://jinka-backend-vvkz.onrender.com';

/* ══════════════════════════════════════════════════════════════════
   CLOCK SYNC  — measure server↔client clock offset via NTP formula
   offset = serverTime − (t0 + t2) / 2
   ══════════════════════════════════════════════════════════════════ */
class ClockSync {
  constructor() {
    this.offset  = 0;   // ms: add to Date.now() to get estimated server time
    this.rtt     = 0;   // ms: measured round-trip time (best sample)
    this._samples  = [];
    this._sendNext = null;
  }

  /** Start a series of clock-sync probes.  sendFn(payload) must send via WS. */
  measure(sendFn, count = 4) {
    this._samples  = [];
    this._count    = count;
    this._sent     = 0;
    this._sendFn   = sendFn;
    this._fire();
  }

  _fire() {
    if (this._sent >= this._count) return;
    this._sent++;
    this._t0 = Date.now();
    this._sendFn({ type: 'clock_sync', t0: this._t0 });
  }

  /** Call when a clock_sync_response message arrives. */
  onResponse(msg) {
    const t2  = Date.now();
    const rtt = t2 - msg.t0;
    const off = msg.t1 - (msg.t0 + t2) / 2;
    this._samples.push({ rtt, off });

    if (this._samples.length < this._count) {
      // stagger probes 200 ms apart to avoid bursting
      setTimeout(() => this._fire(), 200);
    } else {
      // Use the sample with the lowest RTT (most accurate clock reading)
      this._samples.sort((a, b) => a.rtt - b.rtt);
      this.rtt    = this._samples[0].rtt;
      this.offset = this._samples[0].off;
    }
  }

  /** Corrected local time (ms), aligned to server clock */
  now() { return Date.now() + this.offset; }

  /** One-way latency estimate in SECONDS */
  get latencyS() { return this.rtt / 2000; }
}

/* ══════════════════════════════════════════════════════════════════
   DRIFT CORRECTOR
   Every N seconds while both are playing, estimate partner's current
   position and gently adjust our playback rate (or hard-seek if way off).
   ══════════════════════════════════════════════════════════════════ */
class DriftCorrector {
  constructor(audioEl, opts = {}) {
    this._aud           = audioEl;
    this._threshold     = opts.threshold     ?? 0.30;   // s: start correcting
    this._hardSeekAt    = opts.hardSeekAt    ?? 2.8;    // s: give up on rate, just seek
    this._checkMs       = opts.checkMs       ?? 9000;   // how often to check
    this._maxRate       = opts.maxRate       ?? 1.08;   // max speed-up factor
    this._minRate       = opts.minRate       ?? 0.93;   // max slow-down factor
    this._partnerTime   = null;   // partner's last known position (s)
    this._partnerTsMs   = null;   // Date.now() when we received that
    this._enabled       = true;
    this._active        = false;
    this._timer         = null;
    this._rateTimer     = null;
  }

  enable()  { this._enabled = true; }
  disable() { this._enabled = false; if (this._aud) this._aud.playbackRate = 1; }

  /** Called on every partner_heartbeat / sync_response */
  updatePartner(time, latencyS = 0) {
    this._partnerTime  = time + latencyS;   // compensate for transit delay
    this._partnerTsMs  = Date.now();
  }

  reset() { this._partnerTime = null; this._partnerTsMs = null; }

  start() {
    if (this._active) return;
    this._active = true;
    this._timer  = setInterval(() => this._check(), this._checkMs);
  }

  stop() {
    this._active = false;
    clearInterval(this._timer);
    clearTimeout(this._rateTimer);
    if (this._aud) this._aud.playbackRate = 1;
  }

  _check() {
    if (!this._enabled)              return;
    if (this._partnerTime === null)  return;
    if (!this._aud || this._aud.paused || !this._aud.duration) return;

    /* Extrapolate partner's current position */
    const elapsedS   = (Date.now() - this._partnerTsMs) / 1000;
    const estPartner = this._partnerTime + elapsedS;
    const drift      = this._aud.currentTime - estPartner; // + = we're ahead

    if (Math.abs(drift) < this._threshold) {
      this._aud.playbackRate = 1;
      _syncUpdateQuality('good');
      return;
    }

    if (Math.abs(drift) > this._hardSeekAt) {
      /* Hard seek — we're too far off for rate correction */
      this._aud.currentTime  = estPartner;
      this._aud.playbackRate = 1;
      _syncShowToast('Re-synced ✓', '⟳');
      _syncUpdateQuality('fair');
      return;
    }

    /* Soft rate correction */
    _syncUpdateQuality('fair');
    if (drift > 0) {
      /* Ahead — slow down */
      this._aud.playbackRate = Math.max(this._minRate, 1 - drift * 0.18);
    } else {
      /* Behind — speed up */
      this._aud.playbackRate = Math.min(this._maxRate, 1 + Math.abs(drift) * 0.18);
    }

    /* Auto-reset rate after 3 s to prevent runaway */
    clearTimeout(this._rateTimer);
    this._rateTimer = setTimeout(() => {
      if (this._aud) this._aud.playbackRate = 1;
    }, 3000);
  }
}

/* ══════════════════════════════════════════════════════════════════
   REACTIONS SYSTEM — spawns floating emoji on send + receive
   ══════════════════════════════════════════════════════════════════ */
class ReactionsSystem {
  constructor() {
    this._container = document.getElementById('reaction-floats');
  }

  send(emoji) {
    this._spawn(emoji, true);
    if (window._jinkaSync) window._jinkaSync.sendReaction(emoji);
  }

  receive(emoji) {
    this._spawn(emoji, false);
  }

  _spawn(emoji, isSelf) {
    if (!this._container) return;
    const el = document.createElement('div');
    el.className = 'reaction-float' + (isSelf ? ' self' : ' partner');
    el.textContent = emoji;
    const dx = (Math.random() - 0.5) * 44;
    const dr = (Math.random() - 0.5) * 32;
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dr', dr + 'deg');
    el.style.left = (24 + (Math.random() - 0.5) * 20) + 'px';
    this._container.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }
}

/* ══════════════════════════════════════════════════════════════════
   JINKA SYNC  v4 — WebSocket manager
   ══════════════════════════════════════════════════════════════════ */
class JinkaSync {
  constructor({ userId, serverUrl }) {
    this.userId             = userId;
    this.serverUrl          = serverUrl;
    this._ws                = null;
    this._syncActive        = true;
    this._reconnectDelay    = 1500;
    this._maxDelay          = 30000;
    this._intentionalClose  = false;
    this._reconnectTimer    = null;

    /* Song-change debounce — suppress spurious play events right after */
    this._songChangePending = false;
    this._songChangeTimer   = null;

    /* Clock + drift modules */
    this._clock  = new ClockSync();
    this._drift  = new DriftCorrector(aud);

    /* Heartbeat */
    this._heartbeatTimer = null;
    this._pingTimer      = null;
    this._lastActivity   = Date.now();

    /* Sequence number — reject stale events from partner */
    this._seq           = 0;
    this._lastRemoteSeq = -1;

    /* Throttle seek broadcasts */
    this._seekThrottle = null;
  }

  connect()    { this._intentionalClose = false; this._open(); }
  disconnect() {
    this._intentionalClose = true;
    this._stopTimers();
    if (this._ws) this._ws.close(1000);
    this._drift.stop();
  }

  /* ── Heartbeat helpers ───────────────────────────────────────── */
  _startTimers() {
    this._stopTimers();

    /* Heartbeat: every 5 s broadcast our playback position */
    this._heartbeatTimer = setInterval(() => {
      this._send({
        type:      'heartbeat',
        time:      aud.currentTime,
        isPlaying: !aud.paused,
        trackIdx:  typeof cur !== 'undefined' ? cur : null,
        sentAt:    this._clock.now(),
      });
    }, 5000);

    /* Ping: every 5 s, check for stale connection */
    this._pingTimer = setInterval(() => {
      if (Date.now() - this._lastActivity > 18000) {
        /* No messages for 18 s — force reconnect */
        console.warn('[JinkaSync] Activity timeout — reconnecting');
        try { this._ws?.close(); } catch (_) {}
      } else {
        this._send({ type: 'ping', t: Date.now() });
      }
    }, 5000);
  }

  _stopTimers() {
    clearInterval(this._heartbeatTimer);
    clearInterval(this._pingTimer);
  }

  /* ── Send helpers ────────────────────────────────────────────── */
  sendName(name)              { this._send({ type: 'name', name }); }
  sendSong(title, thumb = '') { this._send({ type: 'song', title, thumb }); }

  sendSongChange(index, title, thumb = '', autoplay = true) {
    this._send({ type: 'song_change', index: parseInt(index, 10), title, thumb, autoplay });
    this._send({ type: 'song', title, thumb });
    this._songChangePending = true;
    this._drift.reset();
    clearTimeout(this._songChangeTimer);
    this._songChangeTimer = setTimeout(() => { this._songChangePending = false; }, 1500);
  }

  setSyncActive(active) {
    this._syncActive = Boolean(active);
    this._send({ type: 'sync_toggle', active: this._syncActive });
    active ? this._drift.enable() : this._drift.disable();
  }

  sendPlay(time) {
    if (this._songChangePending) return;
    this._send({ type: 'sync_event', event: 'play',  time, sentAt: this._clock.now(), seq: ++this._seq });
  }
  sendPause(time) {
    if (this._songChangePending) return;
    this._send({ type: 'sync_event', event: 'pause', time, sentAt: this._clock.now(), seq: ++this._seq });
  }
  sendSeek(time) {
    /* Throttle seeks — max one per 300 ms */
    clearTimeout(this._seekThrottle);
    this._seekThrottle = setTimeout(() => {
      this._send({
        type:      'sync_event',
        event:     'seek',
        time:      aud.currentTime,
        isPlaying: !aud.paused,
        sentAt:    this._clock.now(),
        seq:       ++this._seq,
      });
    }, 300);
  }

  sendReaction(emoji) { this._send({ type: 'reaction', emoji }); }

  sendQueueActivity(action) { this._send({ type: 'queue_activity', action }); }

  /* ── WebSocket open ──────────────────────────────────────────── */
  _open() {
    const url = `${this.serverUrl}/ws/sync/?user=${encodeURIComponent(this.userId)}`;
    try { this._ws = new WebSocket(url); } catch(e) { this._scheduleReconnect(); return; }

    _syncOnConnectionState('connecting');

    this._ws.addEventListener('open', () => {
      this._reconnectDelay = 1500;
      this._lastActivity   = Date.now();

      /* 1. Identity + presence */
      if (window._jinkaDisplayName) this.sendName(window._jinkaDisplayName);
      this._send({ type: 'presence', status: 'online' });

      /* 2. Current song label */
      if (typeof TRACKS !== 'undefined' && TRACKS.length && typeof cur !== 'undefined') {
        const t = TRACKS[cur];
        if (t) this.sendSong(t.title, t.thumb || '');
      }

      /* 3. Sync toggle */
      this._send({ type: 'sync_toggle', active: this._syncActive });

      /* 4. Clock sync probe */
      this._clock.measure(p => this._send(p));

      /* 5. Heartbeat + drift */
      this._startTimers();
      this._drift.start();

      /* 6. Request room state (catch-up on reconnect) */
      this._send({ type: 'state_request' });

      _syncOnConnectionState('connected');
    });

    this._ws.addEventListener('message', e => {
      this._lastActivity = Date.now();
      try { this._handle(JSON.parse(e.data)); } catch (_) {}
    });

    this._ws.addEventListener('close', () => {
      this._stopTimers();
      this._drift.stop();
      _syncOnConnectionState('disconnected');
      if (!this._intentionalClose) this._scheduleReconnect();
    });

    this._ws.addEventListener('error', () => {});
  }

  /* ── Message dispatcher ─────────────────────────────────────── */
  _handle(msg) {
    if (msg.user === this.userId) return; /* drop own echoes */

    switch (msg.type) {

      case 'clock_sync_response':
        this._clock.onResponse(msg);
        break;

      case 'pong':
        this._lastActivity = Date.now();
        break;

      case 'presence':
        _syncOnPresence(msg.status, msg.name || '');
        break;

      case 'name_update':
        _syncOnPartnerName(msg.name || '');
        break;

      case 'song':
        _syncOnSong(msg.title, msg.thumb);
        break;

      case 'song_change':
        _syncOnSong(msg.title, msg.thumb);
        this._drift.reset();
        if (typeof msg.index === 'number' && TRACKS && msg.index >= 0 && msg.index < TRACKS.length) {
          _syncRemoteEvent = true;
          aud.addEventListener('canplay', () => {
            this._send({ type: 'sync_request', sentAt: this._clock.now() });
          }, { once: true });
          loadTrack(msg.index, false);
          setTimeout(() => { _syncRemoteEvent = false; }, 2000);
        }
        _syncShowPartnerChangedSong(msg.title);
        break;

      case 'sync_request':
        this._send({
          type:      'sync_response',
          time:      aud.currentTime,
          isPlaying: !aud.paused,
          sentAt:    msg.sentAt,
        });
        break;

      case 'sync_response':
        /* Partner answered our sync_request — update drift baseline */
        this._drift.updatePartner(msg.time, this._clock.latencyS);
        if (msg.isPlaying) {
          _syncOnEvent('play', msg.time, msg.sentAt);
        } else {
          _syncRemoteEvent = true;
          const afterSeek = () => { aud.pause(); setTimeout(() => { _syncRemoteEvent = false; }, 300); };
          aud.currentTime = msg.time;
          aud.seeking
            ? aud.addEventListener('seeked', afterSeek, { once: true })
            : afterSeek();
        }
        break;

      case 'sync_state':
        _syncOnState(msg.both_synced);
        document.getElementById('art-wrap')?.classList.toggle('both-heartbeat', Boolean(msg.both_synced));
        break;

      case 'partner_heartbeat':
        /* Update drift corrector + partner-progress overlay */
        this._drift.updatePartner(msg.time, this._clock.latencyS);
        _syncOnPartnerHeartbeat(msg.time, msg.isPlaying, msg.trackIdx);
        break;

      case 'sync_event': {
        /* De-duplicate stale events via sequence number */
        if (msg.seq !== undefined) {
          if (msg.seq <= this._lastRemoteSeq) break;
          this._lastRemoteSeq = msg.seq;
        }
        _syncOnEvent(msg.event, msg.time, msg.sentAt, msg.isPlaying);
        break;
      }

      case 'room_state':
        /* Restore state when reconnecting or joining */
        if (msg.trackIdx !== null && msg.trackIdx !== undefined
            && typeof TRACKS !== 'undefined' && TRACKS[msg.trackIdx]) {
          if (msg.trackIdx !== cur) {
            _syncRemoteEvent = true;
            loadTrack(msg.trackIdx, false);
            setTimeout(() => { _syncRemoteEvent = false; }, 1200);
          }
          if (typeof msg.currentTime === 'number') {
            const restoreTime = msg.isPlaying
              ? msg.currentTime + this._clock.latencyS
              : msg.currentTime;
            setTimeout(() => {
              aud.currentTime = restoreTime;
              if (msg.isPlaying) aud.play().catch(() => {});
            }, 600);
          }
        }
        break;

      case 'reaction':
        if (window._jinkaReactions) window._jinkaReactions.receive(msg.emoji);
        break;

      case 'queue_activity':
        _syncOnQueueActivity(msg.action);
        break;

      case 'error':
        if (window.showNewSongNotification) window.showNewSongNotification('⚠ ' + msg.message);
        break;
    }
  }

  _send(payload) {
    if (this._ws && this._ws.readyState === WebSocket.OPEN) {
      this._ws.send(JSON.stringify(payload));
    }
  }

  _scheduleReconnect() {
    _syncOnConnectionState('reconnecting');
    this._reconnectTimer = setTimeout(() => {
      this._reconnectDelay = Math.min(this._reconnectDelay * 2, this._maxDelay);
      this._open();
    }, this._reconnectDelay);
  }
}

/* ══════════════════════════════════════════════════════════════════
   UI CALLBACKS — called by JinkaSync on incoming messages
   ══════════════════════════════════════════════════════════════════ */

/* ── Connection state ──────────────────────────────────────────── */
function _syncOnConnectionState(state) {
  const selfDot = document.getElementById('sync-dot-self');
  if (!selfDot) return;

  if (state === 'connected') {
    selfDot.className = 'sync-dot online';
  } else if (state === 'connecting') {
    selfDot.className = 'sync-dot connecting';
  } else if (state === 'reconnecting') {
    selfDot.className = 'sync-dot reconnecting';
    _syncShowToast('Reconnecting…', '🔄');
  } else {
    selfDot.className = 'sync-dot offline';
  }
}

/* ── Presence ──────────────────────────────────────────────────── */
function _syncOnPresence(status, partnerName) {
  const dot  = document.getElementById('sync-dot');
  const song = document.getElementById('sync-partner-song');
  if (!dot) return;
  dot.className = 'sync-dot ' + (status === 'online' ? 'online' : 'offline');

  if (partnerName) _syncOnPartnerName(partnerName);

  if (status === 'offline') {
    if (song) { song.textContent = 'Partner offline'; song.className = ''; }
    _syncUpdateQuality('none');
    document.getElementById('art-wrap')?.classList.remove('both-heartbeat');
    _syncShowToast((window._jinkaPartnerName || 'Partner') + ' went offline', '👋');
  } else if (status === 'online') {
    _syncShowToast((window._jinkaPartnerName || 'Partner') + ' is here ♫', '💕');
  }
}

function _syncOnPartnerName(name) {
  if (!name) return;
  window._jinkaPartnerName = name;
  const label = document.querySelector('.sync-partner-label');
  if (label) label.textContent = name;
  const dot = document.getElementById('sync-dot');
  if (dot) dot.title = name;
}

function _syncOnSong(title, thumb) {
  const el = document.getElementById('sync-partner-song');
  if (!el) return;
  el.textContent = title || '—';
  el.className   = title ? 'online' : 'has-song';
}

function _syncOnState(bothSynced) {
  document.getElementById('sync-widget')?.classList.toggle('both-synced', bothSynced);
  _syncUpdateQuality(bothSynced ? 'good' : 'fair');
}

/* ── Partner heartbeat → progress overlay ─────────────────────── */
function _syncOnPartnerHeartbeat(time, isPlaying, trackIdx) {
  /* Update partner-song label */
  if (typeof TRACKS !== 'undefined' && TRACKS[trackIdx]) {
    _syncOnSong(TRACKS[trackIdx].title, TRACKS[trackIdx].thumb);
  }

  /* Draw partner progress marker on the waveform */
  const waveArea = document.querySelector('.wave-area');
  if (!waveArea || !aud.duration) return;

  let overlay = document.getElementById('partner-progress-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'partner-progress-overlay';
    waveArea.appendChild(overlay);
  }

  const pct = Math.min(1, time / aud.duration);
  overlay.style.left = 'calc(' + (pct * 100) + '% - 1px)';
  overlay.title = (window._jinkaPartnerName || 'Partner') + ' · ' + _fmt(time);
}

/* ── Queue activity ────────────────────────────────────────────── */
function _syncOnQueueActivity(action) {
  if (action === 'browsing') {
    _syncShowActivityPill('Browsing queue…');
  }
}

/* ── Partner changed song toast ────────────────────────────────── */
function _syncShowPartnerChangedSong(title) {
  const name = window._jinkaPartnerName || 'Partner';
  _syncShowToast(`${name} changed to · ${title}`, '♫');
}

/* ── Toast ─────────────────────────────────────────────────────── */
let _syncToastTimer = null;
function _syncShowToast(msg, icon = '⟳') {
  const el = document.getElementById('sync-toast');
  if (!el) return;
  el.textContent = icon + '  ' + msg;
  el.classList.add('show');
  clearTimeout(_syncToastTimer);
  _syncToastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ── Activity pill ─────────────────────────────────────────────── */
let _activityTimer = null;
function _syncShowActivityPill(text) {
  const el = document.getElementById('partner-activity-pill');
  if (!el) return;
  el.textContent = (window._jinkaPartnerName || 'Partner') + ' · ' + text;
  el.style.opacity = '1';
  clearTimeout(_activityTimer);
  _activityTimer = setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

/* ── Sync quality bars ─────────────────────────────────────────── */
function _syncUpdateQuality(level) {
  // level: 'good' | 'fair' | 'poor' | 'none'
  const el = document.getElementById('sync-quality');
  if (!el) return;
  el.className = 'sync-quality q-' + level;
}

/* helper — reuse the existing fmt function alias */
function _fmt(s) {
  if (isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

/* ── Reaction bar toggle ────────────────────────────────────────── */
function toggleReactionBar() {
  document.getElementById('reaction-bar')?.classList.toggle('visible');
}
/* Close reaction bar on outside click */
document.addEventListener('click', (e) => {
  const bar = document.getElementById('reaction-bar');
  const btn = document.getElementById('reaction-trigger');
  if (!bar || !btn) return;
  if (!bar.contains(e.target) && e.target !== btn) {
    bar.classList.remove('visible');
  }
}, { passive: true });

/* ── Sync play/pause/seek — with latency + drift compensation ───── */
function _syncOnEvent(event, time, sentAt, isPlaying) {
  _syncRemoteEvent = true;

  /* One-way latency estimate using our clock offset */
  const _latency = sentAt ? Math.max(0, (Date.now() - sentAt) / 1000) : 0;

  function _seekThen(targetTime, afterCb) {
    aud.pause();
    aud.currentTime = Math.max(0, targetTime);
    if (aud.seeking) {
      aud.addEventListener('seeked', afterCb, { once: true });
    } else {
      afterCb();
    }
  }

  function _doPlay() {
    const p = aud.play();
    if (p instanceof Promise) {
      p.catch(err => console.warn('[Sync] play blocked:', err))
       .finally(() => { setTimeout(() => { _syncRemoteEvent = false; }, 200); });
    } else {
      setTimeout(() => { _syncRemoteEvent = false; }, 300);
    }
  }

  if (event === 'play') {
    _seekThen(time + _latency, _doPlay);
    return;
  }

  if (event === 'pause') {
    _seekThen(time, () => {
      aud.pause();
      setTimeout(() => { _syncRemoteEvent = false; }, 300);
    });
    return;
  }

  if (event === 'seek') {
    const wasPlaying = isPlaying !== undefined ? Boolean(isPlaying) : !aud.paused;
    const corrected  = wasPlaying ? time + _latency : time;
    _seekThen(corrected, () => {
      if (wasPlaying) {
        _doPlay();
      } else {
        aud.pause();
        setTimeout(() => { _syncRemoteEvent = false; }, 300);
      }
    });
    return;
  }

  setTimeout(() => { _syncRemoteEvent = false; }, 300);
}

/* ── loadSong: local selection → broadcast.  NOT called for remote events. ── */
function loadSong(index) {
  const song = TRACKS[index];
  if (!song) return;

  _syncRemoteEvent = true;
  loadTrack(index, false);
  setTimeout(() => { _syncRemoteEvent = false; }, 500);

  const sync = window._jinkaSync;
  if (sync) {
    sync.sendSong(song.title, song.thumb || '');
    if (_syncActive) {
      sync.sendSongChange(index, song.title, song.thumb || '', false);
    }
  }
}
</script>

  <button class="reaction-btn" onclick="window._jinkaReactions&&window._jinkaReactions.send('🥺')">🥺</button>
